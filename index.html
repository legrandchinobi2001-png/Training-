<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Train</title>
<style>
:root{--bg:#050b1f;--bgf:radial-gradient(130% 55% at 50% 0%,#17358a 0%,#0b1c4c 38%,#050b1f 100%);--card:linear-gradient(160deg,rgba(38,70,150,.55),rgba(10,22,58,.7));--in:rgba(4,10,32,.62);--fg:#eef3ff;--mut:#9fb0d8;--acc:#7ea0f5;--g:linear-gradient(135deg,#0f2260,#2f56c4 60%,#4f7be8);--bd:rgba(130,160,235,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f6fd;--bgf:linear-gradient(180deg,#d6e2fb 0%,#eaf0fc 45%,#f6f8fd 100%);--card:linear-gradient(160deg,#ffffff,#eaf0fc);--in:#e6edfb;--fg:#0f1a3a;--mut:#5b6b94;--acc:#14285f;--bd:#c6d3f0}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);background-image:var(--bgf);background-attachment:fixed;background-repeat:no-repeat;-webkit-font-smoothing:antialiased;color:var(--fg);font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 18px 40px}
h1{text-align:center;font-size:20px;margin:6px 0 18px}
.tg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:18px}
.tg button{border:0;background:none;color:var(--mut);font:inherit;padding:10px 18px;border-radius:10px;cursor:pointer}
.tg button.on{background:var(--g);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px;text-align:left;color:var(--fg);font:inherit;cursor:pointer;min-height:170px}
.day svg{width:52px;height:52px;stroke:var(--acc);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.day .ic{width:76px;height:76px;border-radius:20px;background:#fff;display:grid;place-items:center}.day .ic img{max-width:62px;max-height:62px;object-fit:contain}
.day b{display:block;font-size:22px;margin:22px 0 8px}.day span{color:var(--mut);font-size:15px}
.back{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--bd);color:var(--fg);font:inherit;font-weight:600;border-radius:22px;padding:12px 20px;cursor:pointer}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--bd);margin:18px 0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;font-size:19px;padding:8px 0 12px;cursor:pointer}
.tabs button.on{color:var(--fg);font-weight:700;border-color:var(--acc)}
h2{font-size:30px;margin:6px 0 2px}.sub{color:var(--mut)}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin:16px 0}
.eh{display:flex;justify-content:space-between;align-items:flex-start}
.eh b{font-size:22px;display:block}.eh small{color:var(--mut);font-size:15px}
.x{background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer;line-height:1}
.row{display:grid;grid-template-columns:28px 1fr 90px 90px;gap:8px;align-items:center;margin-top:10px}
.row.h{color:var(--mut);font-size:14px;margin-top:14px}.row.h span:nth-child(n+3){text-align:center}
.row input{width:100%;height:50px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--fg);font:inherit;font-size:20px;text-align:center}
.row .l{color:var(--mut)}
.ck{height:50px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--mut);font-size:22px;cursor:pointer}
.ck.on{background:var(--g);color:#fff;border:0}
.add{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;font-size:18px;margin-top:14px;cursor:pointer;padding:0}
.fin{width:100%;border:0;border-radius:18px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:18px;padding:18px;margin-top:6px;cursor:pointer}
.hi{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.hi b{display:block;font-size:18px}.hi small{color:var(--mut)}
.empty{color:var(--mut);text-align:center;margin-top:40px}
.hh{display:flex;justify-content:space-between;align-items:center}
.hi{cursor:pointer}.hi small{display:block;margin-top:2px}.hh>div:last-child{display:flex;align-items:center;gap:4px}
.chev{color:var(--mut);font-size:18px;width:20px;text-align:center}.hd b{font-size:16px;margin-top:12px}.hs{color:var(--mut);font-size:15px;padding:2px 0}
.row input.err{border-color:var(--acc)}
.day,.ex,.hi,.tg{box-shadow:0 10px 28px rgba(4,10,35,.28)}
.ar{display:flex;gap:26px;margin-top:14px}.ar .add{margin-top:0}.ar .rs{color:var(--mut)}
.hh .x{font-size:20px;padding:4px 8px}.hh .x.c{color:var(--acc);font-size:15px;font-weight:700}
.sw{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
.sw .t{font-size:26px;font-variant-numeric:tabular-nums;font-weight:600;flex:1;cursor:pointer}
.sw.sel .t{color:var(--acc)}
.mic{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-weight:600;border-radius:16px;padding:14px;margin:12px 0 6px;cursor:pointer}.mic.on{background:var(--g);color:#fff;border:0}.vm{color:var(--mut);font-size:13px;margin:0 2px 8px}
.sw button{border:1px solid var(--bd);background:var(--in);color:var(--fg);font:inherit;font-weight:600;border-radius:12px;padding:10px 16px;cursor:pointer}

</style></head><body><div id="app"></div>
<script>
const T=[
{n:'Biceps & Forearms',e:[['Biceps curls',3,'',10],['Preacher curls',3,'',10],['Incline curls',3,'',10],['Dead hang + wrist curl (superset)',3,'',10],['Weight hold, one hand',3,'',30],['Weight hold, both hands',3,'',30]]},
{n:'Back',e:[['Pull-ups',4,'',8],['Inverted rows',4,'',10],['Dumbbell rows',3,'',10],['Dumbbell pullover',3,'',10]]},
{n:'Chest',e:[['Standard push-ups',4,'',10],['Incline push-ups',3,'',10],['Wide push-ups',3,'',10],['Standard push-ups',6,'',10]]},
{n:'Shoulders',e:[['Lateral raises',6,'',12],['Dead hang',3,'',30]]},
{n:'Legs',e:[['Jumping squats',1,'',10],['Squats',1,'',10]]}];
const mk=d=>T[d].e.map(([n,s,r,def])=>({n,r,def,sets:Array.from({length:s},()=>({kg:'',reps:'',done:0}))}));
let S={V:8,th:'dark',W:T.map((_,i)=>mk(i)),H:[],L:{}};
try{const s=JSON.parse(localStorage.getItem('train-v2')||'null');if(s&&s.W&&s.W.length<=T.length){S=s;while(S.W.length<T.length)S.W.push(mk(S.W.length));if(S.V!==8){S.W.forEach((w,d)=>w.forEach((x,xi)=>x.sets.forEach((s,si)=>{if(s.kg===''||s.kg==null)s.kg=kgOf(d+'|'+x.n+'|'+xi+'|'+si)})));S.V=8}}}catch(e){}
const save=()=>{try{localStorage.setItem('train-v2',JSON.stringify(S))}catch(e){}};
let view='welcome',tab='workout',cur=0;
const $=document.getElementById('app');
function theme(t){S.th=t;document.documentElement.setAttribute('data-theme',t);save();draw()}
const DB='<svg viewBox="0 0 56 36"><path d="M12 6v24M6 11v14M44 6v24M50 11v14M12 18h32"/></svg>';
function draw(){document.documentElement.setAttribute('data-theme',S.th);
 if(view==='welcome'){$.innerHTML='<div class="wl"><button class="wb" onclick="view=\'home\';draw()">Go even further beyond</button></div>';return}
 if(view==='home'){
  $.innerHTML=`<button class="back" onclick="view='welcome';draw()">‹ Back</button><h1>Train</h1><div class="tg"><button class="${S.th==='light'?'on':''}" onclick="theme('light')">☀ Light</button><button class="${S.th==='dark'?'on':''}" onclick="theme('dark')">☾ Dark</button></div>
  <div class="grid">${T.map((d,i)=>`<button class="day" onclick="view='day';tab='workout';cur=${i};draw();scrollTo(0,0)">${IC[i]||DB}<b>${d.n}</b><span>Day ${i+1} · ${S.W[i].length} exercises</span></button>`).join('')}</div>`;return}
 const W=S.W[cur];
 let h=`<button class="back" onclick="view='home';draw()">‹ Back</button>
 <div class="tabs"><button class="${tab==='workout'?'on':''}" onclick="tab='workout';draw()">Workout</button><button class="${tab==='history'?'on':''}" onclick="tab='history';draw()">History</button></div>`;
 if(tab==='workout'){
  h+=`<h2>${T[cur].n}</h2><div class="sub">Day ${cur+1}</div><button class="mic ${voiceOn?'on':''}" onclick="mic()">🎤 Voice: ${voiceOn?'On · say start or stop':'Off'}</button>${vmsg?`<div class="vm">${vmsg}</div>`:''}${voiceOn?'<div class="vm">Voice controls the highlighted stopwatch. Tap a timer to select it.</div>':''}`+W.map((x,xi)=>`<div class="ex"><div class="eh"><div><b>${x.n}</b><small>${x.r?'Target '+x.r+' reps':x.sets.length+' sets'}</small></div></div>
  <div class="row h"><span>#</span><span>Last</span><span>+kg</span><span>Reps</span></div>`+
  x.sets.map((s,si)=>`<div class="row"><span>${si+1}</span><span class="l">${(S.L[cur+'|'+x.n+'|'+xi+'|'+si]||'–').split('×').pop()}</span><input type="number" inputmode="decimal" placeholder="kg" value="${s.kg}" oninput="S.W[${cur}][${xi}].sets[${si}].kg=this.value;save()"><input type="number" inputmode="numeric" class="${s.err?'err':''}" placeholder="${s.err?'reps?':''}" value="${s.reps}" oninput="S.W[${cur}][${xi}].sets[${si}].reps=this.value;save()"></div>`).join('')+
  `<div class="ar"><button class="add" onclick="addSet(${xi})">+ Add set</button><button class="add rs" onclick="delSet(${xi})">− Delete set</button></div>${sw(cur+'-'+xi)}</div>`).join('')+
  (W.length?`${fmsg?`<div class="vm" style="color:var(--acc)">${fmsg}</div>`:''}<button class="fin" onclick="fin()">Finish workout</button>`:`<div class="empty">No exercises left. <a href="#" onclick="S.W[${cur}]=mk(${cur},S.L);save();draw();return false" style="color:var(--acc)">Restore</a></div>`);
 }else{
  const H=S.H.map((x,i)=>({...x,i})).filter(x=>x.d===cur);
  h+=`<h2>${T[cur].n}</h2><div class="sub">Past workouts</div>`+(H.length?H.slice().reverse().map(x=>`${hcard(x)}`).join(''):`<div class="empty">No finished workouts yet.</div>`);
 }
 $.innerHTML=h}
let SW={},pend=-1,sel='',voiceOn=false,rec=null,vmsg='';
const selK=()=>sel&&sel.startsWith(cur+'-')?sel:cur+'-0';
function vAct(c){if(view!=='day'||tab!=='workout')return;const k=selK(),w=SW[k]||(SW[k]={t:0,s:0});if(c==='start'&&!w.s){w.s=Date.now();draw()}else if(c==='stop'&&w.s){w.t+=Date.now()-w.s;w.s=0;draw()}}
async function nmic(){
 const P=window.Capacitor.Plugins.SpeechRecognition;
 if(voiceOn){voiceOn=false;try{await P.stop()}catch(e){}vmsg='';draw();return}
 try{
  const a=await P.available();
  if(!a.available){vmsg='Speech recognition is not available on this phone.';draw();return}
  const p=await P.requestPermissions();
  if(p.speechRecognition!=='granted'){vmsg='Microphone permission was denied.';draw();return}
  voiceOn=true;vmsg='';
  if(!nmic.l){nmic.l=1;nmic.seen=0;
   P.addListener('partialResults',d=>{const t=((d.matches||d.value||[])[0]||'').toLowerCase();const m=[...t.matchAll(/\b(start|stop)\b/g)].map(x=>x[1]);for(let j=nmic.seen;j<m.length;j++)vAct(m[j]);nmic.seen=m.length});
   P.addListener('listeningState',d=>{nmic.seen=0;if(d.status==='stopped'&&voiceOn)setTimeout(nstart,300)});
  }
  nstart();draw();
 }catch(e){vmsg='Could not start voice: '+(e.message||e);draw()}
}
function nstart(){window.Capacitor.Plugins.SpeechRecognition.start({language:'en-US',maxResults:1,partialResults:true,popup:false}).catch(()=>{})}
function mic(){if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())return nmic();
 if(voiceOn){voiceOn=false;try{rec&&rec.stop()}catch(e){}vmsg='';draw();return}
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){vmsg='Voice commands are not supported in this browser (try Chrome).';draw();return}
 rec=new R();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';let hd={};
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const m=[...e.results[i][0].transcript.toLowerCase().matchAll(/\b(start|stop)\b/g)].map(x=>x[1]);for(let j=hd[i]||0;j<m.length;j++)vAct(m[j]);hd[i]=m.length}};
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceOn=false;vmsg='Microphone access was blocked.';draw()}};
 rec.onend=()=>{hd={};if(voiceOn){try{rec.start()}catch(e){}}};
 try{rec.start();voiceOn=true;vmsg=''}catch(e){vmsg='Could not start the microphone.'}
 draw()}
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function sw(k){const w=SW[k]||{t:0,s:0};return `<div class="sw ${selK()===k?'sel':''}"><span class="t" data-sw="${k}" onclick="sel='${k}';draw()">${fmt(w.t+(w.s?Date.now()-w.s:0))}</span><button onclick="swT('${k}')">${w.s?'Pause':'Start'}</button><button onclick="swR('${k}')">Reset</button></div>`}
function swT(k){sel=k;const w=SW[k]||(SW[k]={t:0,s:0});if(w.s){w.t+=Date.now()-w.s;w.s=0}else w.s=Date.now();draw()}
function swR(k){sel=k;SW[k]={t:0,s:0};draw()}

function kgOf(k){const v=S.L[k];return v&&v.includes('×')?(parseFloat(v)||''):''}
function delH(i){if(pend===i){const d=S.H[i].d,ok={};Object.keys(S.L).forEach(k=>{if(k.startsWith(d+'|'))ok[k]=kgOf(k)});S.H.splice(i,1);pend=-1;openH={};Object.keys(S.L).forEach(k=>{if(k.startsWith(d+'|'))delete S.L[k]});S.H.forEach(h=>{if(h.d===d)Object.assign(S.L,h.lk||{})});S.W[d].forEach((x,xi)=>x.sets.forEach((s,si)=>{const k=d+'|'+x.n+'|'+xi+'|'+si;if(String(s.kg)===String(ok[k]===undefined?'':ok[k]))s.kg=kgOf(k)}));save()}else pend=i;draw()}
const nrm=e=>e.t.map(a=>typeof a==='string'?{kg:a.includes('×')?parseFloat(a)||0:0,reps:+a.split('×').pop()||0}:a);
function hcard(x){
 const ex=x.s.map(e=>({n:e.n,t:nrm(e)}));
 const sum=f=>ex.filter(e=>f(e.n)).reduce((a,e)=>a+e.t.reduce((b,s)=>b+s.reps,0),0);
 const nm=T[x.d].n;
 const line=nm==='Chest'?'Total push-ups: '+sum(n=>/push-ups/i.test(n)):nm==='Back'?'Total pull-ups: '+sum(n=>n==='Pull-ups'):'Total reps: '+sum(()=>true);
 const o=!!openH[x.i];
 return `<div class="hi" onclick="openH[${x.i}]=!openH[${x.i}];draw()"><div class="hh"><div><b>${x.date}</b><small>${line}</small></div><div><button class="x ${pend===x.i?'c':''}" aria-label="Delete workout" onclick="event.stopPropagation();delH(${x.i})">${pend===x.i?'Delete?':'🗑'}</button><span class="chev">${o?'▾':'▸'}</span></div></div>${o?ex.map(e=>`<div class="hd"><b>${e.n}</b>${e.t.map((s,i)=>`<div class="hs">Set ${i+1}: ${s.reps} reps${s.kg?' · +'+s.kg+' kg':''}</div>`).join('')}</div>`).join(''):''}</div>`}
setInterval(()=>{document.querySelectorAll('[data-sw]').forEach(e=>{const w=SW[e.dataset.sw];if(w&&w.s)e.textContent=fmt(w.t+Date.now()-w.s)})},250);
function delSet(xi){const x=S.W[cur][xi];if(x.sets.length>1){x.sets.pop();save();draw()}}
function ck(xi,si){const s=S.W[cur][xi].sets[si];if(!s.done&&!(+s.reps>0)){s.err=1;draw();return}s.err=0;s.done=s.done?0:1;save();draw()}
function addSet(xi){const x=S.W[cur][xi],l=x.sets[x.sets.length-1];x.sets.push({kg:'',reps:'',done:0});save();draw()}
function rm(xi){S.W[cur].splice(xi,1);Object.keys(SW).forEach(k=>{if(k.startsWith(cur+'-')){delete SW[k]}});save();draw()}
function fin(){
 const sm=[],lk={};S.W[cur].forEach((x,xi)=>{const t=[];x.sets.forEach((s,si)=>{if(+s.reps>0){t.push({kg:+s.kg||0,reps:+s.reps||0});const kk=cur+'|'+x.n+'|'+xi+'|'+si,lv=(+s.kg?s.kg+'kg×':'')+s.reps;S.L[kk]=lv;lk[kk]=lv}});if(t.length)sm.push({n:x.n,t})});
 if(!sm.length){fmsg='Enter reps for at least one set first.';draw();return}fmsg='';
 S.H.push({d:cur,date:new Date().toLocaleDateString(),s:sm,lk});const old=S.W[cur].slice();S.W[cur]=mk(cur).map(x=>{const j=old.findIndex(o=>o.n===x.n&&!o.u);if(j<0)return x;old[j].u=1;x.sets=old[j].sets.map((_,si)=>({kg:kgOf(cur+'|'+x.n+'|'+j+'|'+si),reps:'',done:0}));return x});save();tab='history';draw();scrollTo(0,0)}
draw();
</script></body></html>
